<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RV — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --darknavy: #0d1b2a;
      --offwhite: #f5f3ee;
      --denim: #3b5b8c;
      --red: #d72638;
    }
    /* Dark mode (default) */
    :root, [data-theme="dark"] {
      --bg: var(--darknavy);
      --fg: var(--offwhite);
      --muted: var(--denim);
    }
    [data-theme="light"] {
      --bg: var(--offwhite);
      --fg: var(--darknavy);
      --muted: var(--denim);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      text-align: center;
      transition: background 0.3s ease, color 0.3s ease;
    }
    .banner {
      font-family: "Dancing Script", cursive;
      font-size: clamp(5rem, 24vw, 15rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1;
      color: var(--denim);
    }
    .banner::after {
      content: ".";
      color: var(--red);
    }
    .coming-soon {
      margin-top: 1.5rem;
      font-size: clamp(1rem, 4vw, 1.75rem);
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .toggle {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.75rem;
      height: 2.75rem;
      background: transparent;
      border: none;
      color: var(--denim);
      cursor: pointer;
      transition: color 0.2s ease, transform 0.2s ease;
    }
    .toggle svg {
      width: 1.5rem;
      height: 1.5rem;
      fill: currentColor;
    }
    .toggle:hover {
      transform: scale(1.1);
    }
    .toggle:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 2px;
      border-radius: 6px;
    }
    .toggle .icon-sun { display: none; }
    .toggle .icon-moon { display: block; }
    [data-theme="light"] .toggle .icon-sun { display: block; }
    [data-theme="light"] .toggle .icon-moon { display: none; }
  </style>
</head>
<body>
  <button class="toggle" id="themeToggle" aria-label="Toggle light and dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-13a1 1 0 0 1-1-1V1a1 1 0 0 1 2 0v2a1 1 0 0 1-1 1zm0 19a1 1 0 0 1-1-1v-2a1 1 0 0 1 2 0v2a1 1 0 0 1-1 1zM4.93 6.34a1 1 0 0 1-.7-.29L2.81 4.63a1 1 0 0 1 1.42-1.42l1.41 1.42a1 1 0 0 1-.71 1.71zm14.14 14.14a1 1 0 0 1-.7-.29l-1.42-1.42a1 1 0 0 1 1.42-1.41l1.41 1.41a1 1 0 0 1-.71 1.71zM3 13H1a1 1 0 0 1 0-2h2a1 1 0 0 1 0 2zm20 0h-2a1 1 0 0 1 0-2h2a1 1 0 0 1 0 2zM3.52 20.48a1 1 0 0 1-.71-1.71l1.42-1.42a1 1 0 0 1 1.41 1.42l-1.41 1.41a1 1 0 0 1-.71.3zM17.66 6.34a1 1 0 0 1-.71-1.71l1.41-1.42a1 1 0 0 1 1.42 1.42l-1.42 1.42a1 1 0 0 1-.7.29z"/></svg>
  </button>
  <div class="banner">rv</div>
  <div class="coming-soon">Coming Soon</div>

  <script>
    (function () {
      const root = document.documentElement;
      const btn = document.getElementById("themeToggle");

      let saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
      // Show the saved choice, else follow the OS without saving it.
      root.setAttribute("data-theme", saved === "light" || saved === "dark" ? saved : (prefersLight ? "light" : "dark"));

      btn.addEventListener("click", function () {
        const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
