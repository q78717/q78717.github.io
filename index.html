<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to q-rv.github.io</title>
  <link rel="canonical" href="https://q-rv.github.io/">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://q-rv.github.io/">
  <script>
    // Keep the path, query and hash so deep links land on the same page.
    location.replace("https://q-rv.github.io" + location.pathname + location.search + location.hash);
  </script>
  <style>
    :root { --darknavy: #0d1b2a; --offwhite: #f5f3ee; --denim: #3b5b8c; --red: #d72638;
            --bg: var(--offwhite); --fg: var(--darknavy); }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: var(--darknavy); --fg: var(--offwhite); }
    }
    :root[data-theme="dark"] { --bg: var(--darknavy); --fg: var(--offwhite); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: var(--bg); color: var(--fg); text-align: center; }
    a { color: var(--denim); font-weight: 600; }
    a:hover { color: var(--red); }
    #theme { position: fixed; top: 16px; right: 16px; background: none; cursor: pointer;
             border: 1px solid var(--denim); color: var(--fg); border-radius: 6px; padding: 6px 10px; font: inherit; }
  </style>
</head>
<body>
  <button id="theme" type="button" aria-label="Toggle theme">◐</button>
  <p>This site has moved to <a href="https://q-rv.github.io/">q-rv.github.io</a>.</p>
  <script>
    document.getElementById("theme").addEventListener("click", function () {
      var r = document.documentElement;
      var dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      r.dataset.theme = dark ? "light" : "dark";
    });
  </script>
</body>
</html>
